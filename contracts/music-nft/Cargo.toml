[package]
name = "musicstreamx-music-nft"
version = "1.0.0"
edition = "2021"
description = "Music NFT contract for MusicStreamX"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
musicstreamx-shared = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
