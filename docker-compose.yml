version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: musicstreamx-postgres
    environment:
      POSTGRES_DB: musicstreamx
      POSTGRES_USER: musicstreamx
      POSTGRES_PASSWORD: musicstreamx123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - musicstreamx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicstreamx -d musicstreamx"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: musicstreamx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - musicstreamx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IPFS Node
  ipfs:
    image: ipfs/kubo:latest
    container_name: musicstreamx-ipfs
    ports:
      - "4001:4001"  # P2P port
      - "5001:5001"  # API port
      - "8080:8080"  # Gateway port
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - musicstreamx-network
    environment:
      - IPFS_PROFILE=server
    command: ["daemon", "--migrate=true"]

  # API Gateway
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: musicstreamx-api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://musicstreamx:musicstreamx123@postgres:5432/musicstreamx
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      STELLAR_NETWORK: testnet
      STELLAR_CONTRACT_ADDRESS: ${STELLAR_CONTRACT_ADDRESS:-}
      FRONTEND_URL: http://localhost:3100
      IPFS_API_URL: http://ipfs:5001
      IPFS_GATEWAY_URL: http://ipfs:8080
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ipfs:
        condition: service_started
    networks:
      - musicstreamx-network
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
      - uploads:/app/uploads
    command: npm run dev

  # Music Player Frontend
  music-player:
    build:
      context: ./frontend/music-player
      dockerfile: Dockerfile
    container_name: musicstreamx-music-player
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
      VITE_STELLAR_NETWORK: testnet
      VITE_STELLAR_CONTRACT_ADDRESS: ${STELLAR_CONTRACT_ADDRESS:-}
      VITE_IPFS_GATEWAY_URL: http://localhost:8080
    ports:
      - "3100:3000"
    depends_on:
      - api-gateway
      - ipfs
    networks:
      - musicstreamx-network
    volumes:
      - ./frontend/music-player:/app
      - /app/node_modules
    command: npm run dev

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: musicstreamx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - musicstreamx-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: musicstreamx-grafana
    ports:
      - "9091:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - musicstreamx-network
    depends_on:
      - prometheus

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: musicstreamx-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api-gateway
      - music-player
    networks:
      - musicstreamx-network
    command: nginx -g 'daemon off;'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ipfs_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  uploads:
    driver: local

networks:
  musicstreamx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
